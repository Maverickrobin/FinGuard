<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard — Autonomous Risk & Finance Sentinel</title>
    <meta name="description" content="Institutional-grade AI personal finance & risk agent. Continuous transaction analysis, anomaly detection, cash flow forecasting, with a code-enforced Human Approval Barrier for high-impact decisions.">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar" aria-label="Main Navigation">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon-svg">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>
                <span class="logo-text">FinGuard</span>
            </div>
            <div class="logo-subtitle">
                <span class="pulse-dot"></span> Sentinel Active
            </div>
        </div>
        
        <div class="nav-links">
            <a href="#" class="nav-link active" data-view="dashboard" id="nav-dashboard">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                </span>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-link" data-view="transactions" id="nav-transactions">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                </span>
                <span>Ledger & Activity</span>
            </a>
            <a href="#" class="nav-link" data-view="analysis" id="nav-analysis">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>
                </span>
                <span>Anomalies & Forecast</span>
            </a>
            <a href="#" class="nav-link" data-view="scenarios" id="nav-scenarios">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="21" y2="21"/><line x1="4" x2="20" y1="3" y2="3"/><line x1="4" x2="20" y1="12" y2="12"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="3" r="2"/><circle cx="12" cy="21" r="2"/></svg>
                </span>
                <span>What-If Simulator</span>
            </a>
            <a href="#" class="nav-link" data-view="recommendations" id="nav-recommendations">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                </span>
                <span>Recommendations</span>
                <span class="nav-badge" id="rec-badge" style="display:none">0</span>
            </a>
            <a href="#" class="nav-link" data-view="approval" id="nav-approval">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
                <span>Approval Gate</span>
                <span class="nav-badge danger" id="approval-badge" style="display:none">0</span>
            </a>
            <a href="#" class="nav-link" data-view="audit" id="nav-audit">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
                </span>
                <span>Audit Trail</span>
            </a>
        </div>
        
        <div class="sidebar-footer" onclick="openProfileSwitcherModal()" style="cursor:pointer" title="Click to switch profile">
            <div class="persona-info">
                <div class="persona-avatar">PS</div>
                <div>
                    <div class="persona-name">Priya Sharma</div>
                    <div class="persona-role">Software Engineer • ₹85k/mo</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
        <!-- Top Navigation Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation menu">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
                </button>
                <h1 id="page-title" class="page-title">Dashboard</h1>
            </div>
            <div class="top-bar-actions">
                <div id="profile-topbar-pill" class="profile-topbar-pill" onclick="openProfileSwitcherModal()" title="Switch or create profile">
                    <span class="persona-avatar-sm">PS</span>
                    <span style="font-weight:600">Priya Sharma</span>
                    <span class="badge badge-low" style="font-size:10px;padding:1px 6px">DEMO</span>
                    <span style="color:var(--text-tertiary);margin-left:4px">▼</span>
                </div>
                <button class="btn btn-secondary btn-sm" id="btn-run-analysis" title="Re-evaluate anomaly models and cash flow forecast">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    Run Analysis Pipeline
                </button>
            </div>
        </header>

        <!-- View Container (Rendered dynamically) -->
        <div id="view-container" class="view-container" role="region" aria-live="polite">
            <!-- Dynamic view injected here -->
        </div>
    </main>

    <!-- Global Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="assertive"></div>

    <!-- Edit Action Modal (Approval Gate) -->
    <div id="edit-modal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal-backdrop" id="edit-modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">Edit Action Parameters</h2>
                <button class="modal-close" id="edit-modal-close" aria-label="Close dialog">&times;</button>
            </div>
            <div class="modal-body" id="edit-modal-body">
                <!-- Dynamic form fields -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="edit-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="edit-modal-save">Save & Authorize</button>
            </div>
        </div>
    </div>

    <!-- Application Script Suite -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/profiles.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/transactions.js"></script>
    <script src="/static/js/analysis.js"></script>
    <script src="/static/js/scenarios.js"></script>
    <script src="/static/js/recommendations.js"></script>
    <script src="/static/js/approval.js"></script>
    
    <!-- Bootstrap Application -->
    <script>
        if (typeof initApp === 'function') {
            initApp();
        } else if (typeof window.initApp === 'function') {
            window.initApp();
        }
    </script>
</body>
</html>
