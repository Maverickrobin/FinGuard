<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard — AI-Powered Personal Finance Agent</title>
    <meta name="description" content="AI-powered personal finance and financial risk agent that analyzes transactions, detects anomalies, forecasts cash flow, and keeps high-impact decisions under human control.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">FinGuard</span>
            </div>
            <span class="logo-subtitle">AI Finance Agent</span>
        </div>
        
        <div class="nav-links">
            <a href="#" class="nav-link active" data-view="dashboard" id="nav-dashboard">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-link" data-view="transactions" id="nav-transactions">
                <span class="nav-icon">💳</span>
                <span>Transactions</span>
            </a>
            <a href="#" class="nav-link" data-view="analysis" id="nav-analysis">
                <span class="nav-icon">🔍</span>
                <span>Analysis</span>
            </a>
            <a href="#" class="nav-link" data-view="scenarios" id="nav-scenarios">
                <span class="nav-icon">🎯</span>
                <span>Scenarios</span>
            </a>
            <a href="#" class="nav-link" data-view="recommendations" id="nav-recommendations">
                <span class="nav-icon">💡</span>
                <span>Recommendations</span>
                <span class="nav-badge" id="rec-badge" style="display:none">0</span>
            </a>
            <a href="#" class="nav-link" data-view="approval" id="nav-approval">
                <span class="nav-icon">🔐</span>
                <span>Approval Gate</span>
                <span class="nav-badge danger" id="approval-badge" style="display:none">0</span>
            </a>
            <a href="#" class="nav-link" data-view="audit" id="nav-audit">
                <span class="nav-icon">📋</span>
                <span>Audit Trail</span>
            </a>
        </div>
        
        <div class="sidebar-footer">
            <div class="persona-info">
                <div class="persona-avatar">PS</div>
                <div>
                    <div class="persona-name">Priya Sharma</div>
                    <div class="persona-role">Software Engineer</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <h1 id="page-title" class="page-title">Dashboard</h1>
            <div class="top-bar-actions">
                <button class="btn btn-secondary btn-sm" id="btn-run-analysis" title="Run analysis pipeline">
                    ⚡ Run Analysis
                </button>
            </div>
        </header>

        <!-- View Container -->
        <div id="view-container" class="view-container">
            <!-- Views are loaded dynamically by JS -->
        </div>
    </main>

    <!-- Toast notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" style="display:none">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">Edit Action</h2>
                <button class="modal-close" id="edit-modal-close">&times;</button>
            </div>
            <div class="modal-body" id="edit-modal-body">
                <!-- Dynamic form -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="edit-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="edit-modal-save">Save & Approve</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/transactions.js"></script>
    <script src="/static/js/analysis.js"></script>
    <script src="/static/js/scenarios.js"></script>
    <script src="/static/js/recommendations.js"></script>
    <script src="/static/js/approval.js"></script>
</body>
</html>
